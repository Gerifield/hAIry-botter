# Full stack with sandboxed skills MCP server + travel planner CLI sub-agent.
# The bot reads config.yaml from the repo root (bind-mounted read-only).
# config.d/ and skill.d/ are bind-mounted so the CLI sub-agent launched inside
# the bot container can reach its config and the wienerlinien skill file.
# Set GEMINI_API_KEY as an env var or put it in config.yaml under api_keys.gemini.
version: '3.4'
services:
  mcp-skill:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile-mcp-skill
      target: production
    environment:
      PORT: 8090
    ports:
      - "8090:8090"

  bot:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile-bot
      target: production
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./config.d:/app/config.d:ro
      - ./skill.d:/app/skill.d:ro
      - bot-history:/app/history-gemini
      - bot-context:/app/bot-context
    depends_on:
      - mcp-skill

  client-telegram:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile-client-telegram
      target: production
    environment:
      AI_SERVICE: http://bot:8080
    env_file:
      - .env
    ports:
      - "8085:8085"
    depends_on:
      - bot

volumes:
  bot-history:
  bot-context:
